<style>
  :root {
    --gold: #F0B429;
    --gold-dim: #c9922b;
    --dark: #0A0C10;
    --dark2: #111318;
    --dark3: #181C24;
    --card: #1A1F2B;
    --card2: #212738;
    --border: rgba(240,180,41,0.15);
    --border2: rgba(240,180,41,0.3);
    --text: #E8EAF0;
    --muted: #8892A4;
    --green: #22C55E;
    --red: #EF4444;
    --blue: #3B82F6;
    --cyan: #06B6D4;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(240,180,41,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,180,41,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0A0C10 0%, #111827 50%, #0A0C10 100%);
    border-bottom: 1px solid var(--border2);
    padding: 60px 20px 50px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -100px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 300px;
    background: radial-gradient(ellipse, rgba(240,180,41,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .badge {
    display: inline-block;
    background: rgba(240,180,41,0.1);
    border: 1px solid var(--border2);
    color: var(--gold);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  header h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 16px;
  }

  header h1 span { color: var(--gold); }

  header p {
    color: var(--muted);
    font-size: 1.1rem;
    max-width: 600px;
    margin: 0 auto;
  }

  /* NAV DOTS */
  .toc {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    margin: 40px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .toc-label {
    color: var(--gold);
    font-weight: 700;
    font-size: 0.9rem;
    margin-left: 8px;
    white-space: nowrap;
  }

  .toc a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .toc a:hover {
    color: var(--gold);
    border-color: var(--border2);
    background: rgba(240,180,41,0.05);
  }

  /* SECTION */
  .section {
    margin-bottom: 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .section:hover { border-color: var(--border2); }

  .section-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .section-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    flex-shrink: 0;
  }

  .icon-gold { background: rgba(240,180,41,0.12); }
  .icon-green { background: rgba(34,197,94,0.12); }
  .icon-red { background: rgba(239,68,68,0.12); }
  .icon-blue { background: rgba(59,130,246,0.12); }
  .icon-cyan { background: rgba(6,182,212,0.12); }
  .icon-purple { background: rgba(168,85,247,0.12); }
  .icon-orange { background: rgba(249,115,22,0.12); }

  .section-title {
    flex: 1;
  }

  .section-title h2 {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .section-title .en-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .toggle-btn {
    color: var(--muted);
    font-size: 1.2rem;
    transition: transform 0.3s;
  }

  .section.open .toggle-btn { transform: rotate(180deg); }

  .section-body {
    padding: 0 28px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.3s;
  }

  .section.open .section-body {
    padding: 24px 28px;
    max-height: 2000px;
  }

  /* DEFINITION BOX */
  .def-box {
    background: var(--card2);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 20px;
    border-right: 3px solid var(--gold);
  }

  .def-box p { color: var(--text); line-height: 1.8; font-size: 0.95rem; }

  /* EXAMPLE BOX */
  .example-box {
    background: rgba(240,180,41,0.05);
    border: 1px solid rgba(240,180,41,0.2);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }

  .example-label {
    color: var(--gold);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .example-box p { color: var(--text); line-height: 1.8; font-size: 0.92rem; }

  /* INFO GRID */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }

  .info-card {
    background: var(--card2);
    border-radius: 12px;
    padding: 16px;
    border: 1px solid var(--border);
    text-align: center;
  }

  .info-card .val {
    font-size: 1.6rem;
    font-weight: 900;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .info-card .lbl { color: var(--muted); font-size: 0.82rem; }

  /* CANDLE VISUAL */
  .candle-demo {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin: 20px 0;
    align-items: flex-end;
  }

  .candle-wrap { text-align: center; }

  .candle-wrap .name { font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }

  .candle {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    margin: 0 auto;
  }
